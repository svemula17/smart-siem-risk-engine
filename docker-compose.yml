services:
  siem:
    build: .
    ports:
      - "8000:8000"
      - "5514:5514/udp"   # syslog UDP (SYSLOG_ENABLED=1)
      - "5515:5515"       # syslog TCP
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/smart_siem.db
    volumes:
      - siem-data:/app/data
    restart: unless-stopped

volumes:
  siem-data:
